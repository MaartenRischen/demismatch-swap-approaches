<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decode Cards 3D</title><meta name="robots" content="noindex, nofollow">
<meta name="description" content="Swap cards in 3D: a modern situation on top, the same moment as the brain reads it below.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>:root{--oxblood:#3a1218;--parchment:#ece0c4;--teal:#2d6b6b;--serif:"Spectral",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
html,body{margin:0;background:var(--parchment);color:var(--oxblood)}
body{overflow-x:hidden}
header{padding:32px 16px 8px}
@media (min-width:900px){header{padding:32px 32px 8px}}
h1{font:italic 500 clamp(30px,4vw,52px)/1.08 var(--serif);margin:0 0 10px}
header p{font:400 clamp(17px,1.6vw,21px)/1.4 var(--serif);margin:0;max-width:62ch}
ul{list-style:none;margin:24px 0 0;padding:0 16px 60px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px}
@media (min-width:900px){ul{padding:0 32px 60px}}
@media (max-width:1400px){ul{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1000px){ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){ul{grid-template-columns:1fr}}
img{display:block;width:100%;height:auto}
.foot{font:400 13px/1.5 var(--mono);color:var(--teal);padding:0 16px 40px}
@media (min-width:900px){.foot{padding:0 32px 40px}}
</style></head><body>
<header><h1>Decode cards</h1>
<p>Each card shows a situation twice: today on top, and below it the same moment as the brain reads it. One thing swaps. The red figure is the person the card is about.</p></header>
<ul>
<li><a href="01-baby-put-down/card.html"><img src="01-baby-put-down/card.png" width="1080" height="1920" loading="lazy" alt="She screams the second you put her down. what her brain sees. A baby left alone at night could be taken by an animal. Crying brought the adults back."></a></li>
<li><a href="02-fantasy-bra-outrage/card.html"><img src="02-fantasy-bra-outrage/card.png" width="1080" height="1920" loading="lazy" alt="Furious about a bra you will never wear. what your brain sees. Showing off meat you didn't hunt got you mocked by everyone. You still want to join in."></a></li>
<li><a href="03-ukraine-grid-strikes/card.html"><img src="03-ukraine-grid-strikes/card.png" width="1080" height="1920" loading="lazy" alt="76 grid strikes in a week. Still no surrender.. what their brains see. An attack from outside used to pull a group together. It still does."></a></li>
<li><a href="04-awake-at-1am/card.html"><img src="04-awake-at-1am/card.png" width="1080" height="1920" loading="lazy" alt="Exhausted, still awake at 1am. what your brain sees. Light used to mean it was daytime. Your phone tells your brain it still is."></a></li>
<li><a href="05-outrage-addiction/card.html"><img src="05-outrage-addiction/card.png" width="1080" height="1920" loading="lazy" alt="Outrage addiction. what your brain sees. An insult used to be settled face to face by morning. Online it never stops."></a></li>
<li><a href="06-doomscrolling-gaza/card.html"><img src="06-doomscrolling-gaza/card.png" width="1080" height="1920" loading="lazy" alt="Doomscrolling the Israel-Gaza war. what your brain sees. If you could see a raid, it could reach you. Your body still gets ready to run."></a></li>
<li><a href="07-trump-derangement/card.html"><img src="07-trump-derangement/card.png" width="1080" height="1920" loading="lazy" alt="Trump derangement syndrome. what your brain sees. A would-be boss used to get laughed down by the band. A president can't be."></a></li>
<li><a href="08-ai-psychosis/card.html"><img src="08-ai-psychosis/card.png" width="1080" height="1920" loading="lazy" alt="AI psychosis. what your brain sees. Only a close friend used to listen like that. Your brain bonds with the chatbot."></a></li>
<li><a href="09-meaning-crisis/card.html"><img src="09-meaning-crisis/card.png" width="1080" height="1920" loading="lazy" alt="The meaning crisis. what your brain sees. Work used to feed people you could see. Your brain can't see who a spreadsheet feeds."></a></li>
<li><a href="10-fomo/card.html"><img src="10-fomo/card.png" width="1080" height="1920" loading="lazy" alt="FOMO. what your brain sees. Being left behind by your group was dangerous. A party photo sets off the same alarm."></a></li>
<li><a href="11-rejection-sensitivity/card.html"><img src="11-rejection-sensitivity/card.png" width="1080" height="1920" loading="lazy" alt="Rejection sensitive dysphoria. what your brain sees. Falling out with the leader could get you thrown out. &quot;Can we talk?&quot; sets off that alarm."></a></li>
<li><a href="12-loneliness-epidemic/card.html"><img src="12-loneliness-epidemic/card.png" width="1080" height="1920" loading="lazy" alt="The loneliness epidemic. what your brain sees. People used to work side by side all day. Alone at a laptop, your brain feels left out."></a></li>
<li><a href="13-dating-app-burnout/card.html"><img src="13-dating-app-burnout/card.png" width="1080" height="1920" loading="lazy" alt="Dating app burnout. what your brain sees. You used to choose from a few people you'd known for life. The app never runs out."></a></li>
<li><a href="14-food-noise/card.html"><img src="14-food-noise/card.png" width="1080" height="1920" loading="lazy" alt="Food noise. what your brain sees. Sugar and fat were rare, so you ate them on the spot. Now they're everywhere."></a></li>
</ul>
